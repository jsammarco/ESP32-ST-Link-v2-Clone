# N32G031K8Q7-1 through the ESP32 USB-serial remote_bitbang SWD bridge.
#
# tools/serial_bridge.py carries this localhost TCP connection over the ESP32's
# CP2102/CH340 COM port. This is a generic SWD transport, not the ST-Link
# high-level adapter (HLA) transport, hence the explicit "swd" select.

adapter driver remote_bitbang
if {[info exists ::env(ESP32_SWD_HOST)]} {
    set _ESP32_SWD_HOST $::env(ESP32_SWD_HOST)
} else {
    set _ESP32_SWD_HOST 127.0.0.1
}
remote_bitbang host $_ESP32_SWD_HOST
remote_bitbang port 3335
transport select swd

# remote_bitbang timing is set by HALF_CYCLE_US in the ESP32 firmware. Existing
# generated direct_flash.tcl files contain "adapter speed 1000" for ST-Link;
# suppress that no-op directive so it cannot make a serial bridge session fail.
rename adapter _esp32_original_adapter
proc adapter {args} {
    if {[llength $args] == 2 && [lindex $args 0] eq "speed"} {
        return
    }
    uplevel 1 [list _esp32_original_adapter {*}$args]
}

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

set _CHIPNAME n32g031

# The N32G031 reports 0x0bb11477, which the stock stm32g0x target rejects.
# 0 deliberately skips the IDCODE check, matching this repository's ST-Link
# configuration.
set _CPUTAPID 0

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian little -dap $_CHIPNAME.dap
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x1000 -work-area-backup 0

# The normal three-wire cable has no NRST connection. "reset run" therefore
# uses the Cortex-M software reset request rather than driving GPIO27.
reset_config none
