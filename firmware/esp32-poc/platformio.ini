[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; Defaults match the repository's primary SWD probe orientation:
    ; GPIO25/CC1 receives N32 PA14 TX; GPIO26/CC2 drives N32 PA13 RX.
    ; Change these only after the continuity checks in ../../docs/RAZ_ESP32_POC.md.
    -D RAZ_UART_RX_PIN=25
    -D RAZ_UART_TX_PIN=26
    -D RAZ_LINK_ENABLE_PIN=-1
